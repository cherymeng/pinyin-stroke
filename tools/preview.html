<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
body { margin:0; background:#fff; font:12px/1.2 -apple-system,sans-serif; }
.grid { display:flex; flex-wrap:wrap; }
.cell { width:170px; height:190px; position:relative; border:1px solid #eee; }
.cell svg { width:100%; height:100%; display:block; overflow:visible; }
.tag { position:absolute; left:5px; top:3px; color:#999; font-size:12px; }
</style></head>
<body>
<div class="grid" id="g"></div>
<script>
fetch('./strokes.json').then(r => r.json()).then(data => {
  const g = document.getElementById('g');
  const chars = (new URLSearchParams(location.search).get('c') || 'aoeiuü').split('');
  for (const ch of chars) {
    const d = data[ch]; if (!d) continue;
    const cell = document.createElement('div');
    cell.className = 'cell';
    const ox = 12;
    const pt = (p) => `${(ox + p[0]).toFixed(2)},${p[1].toFixed(2)}`;
    let paths = '', marks = '', tones = '';
    d.body.forEach((s, i) => {
      const pts = s.p.map(pt).join(' ');
      paths += `<polyline points="${pts}" fill="none" stroke="rgba(200,40,40,.85)" stroke-width="${Math.max(1, s.w * 0.5)}" stroke-linecap="round" stroke-linejoin="round"/>`;
      const [x0, y0] = s.p[0];
      marks += `<circle cx="${ox + x0}" cy="${y0}" r="2.2" fill="#1a7"/><text x="${ox + x0 + 2.5}" y="${y0 - 2.5}" font-size="8" fill="#1a7">${i + 1}</text>`;
    });
    (d.tones || []).forEach((s) => {
      tones += `<polyline points="${s.p.map(pt).join(' ')}" fill="none" stroke="rgba(40,90,200,.85)" stroke-width="${Math.max(1, s.w * 0.5)}" stroke-linecap="round"/>`;
    });
    cell.innerHTML = `<svg viewBox="-4 -88 82 124">
      <line x1="-4" y1="-78.1" x2="78" y2="-78.1" stroke="#d9cbb8"/>
      <line x1="-4" y1="-49.8" x2="78" y2="-49.8" stroke="#e2d6c6" stroke-dasharray="4 4"/>
      <line x1="-4" y1="0" x2="78" y2="0" stroke="#d9cbb8"/>
      <line x1="-4" y1="23.9" x2="78" y2="23.9" stroke="#d9cbb8"/>
      ${paths}${tones}${marks}
    </svg><div class="tag">${ch} · ${d.body.length}笔${d.tones && d.tones.length ? ' + 调号' : ''}</div>`;
    g.appendChild(cell);
  }
});
</script>
</body></html>
